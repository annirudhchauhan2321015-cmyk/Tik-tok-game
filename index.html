<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Series Mode</title>
    <style>
        body {
            margin: 0;
            background: #4a0e4e;
            color: #fff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .header-title {
            background: #fff;
            color: #4a0e4e;
            padding: 8px 30px;
            border-radius: 5px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 2px solid #ccc;
            text-align: center;
        }

        .menu-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 300px;
        }

        .menu-section-title {
            margin: 0;
            font-size: 14px;
            color: #ffd700;
            text-align: left;
        }

        .mode-buttons, .match-options {
            display: flex;
            gap: 8px;
        }

        .option-btn, .match-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid transparent;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
            transition: 0.2s;
        }

        .option-btn.selected, .match-btn.selected {
            background: #ffd700;
            color: #4a0e4e;
            border-color: #fff;
        }

        .custom-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            text-align: center;
            width: 100%;
        }

        .start-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-top: 5px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 310px;
            margin-bottom: 12px;
            gap: 10px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid transparent;
            flex: 1;
        }

        .player-card.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .player-card.series-winner {
            background: rgba(46, 213, 115, 0.4) !important;
            border-color: #2ed573 !important;
            box-shadow: 0 0 15px #2ed573;
        }

        .player-card h3 {
            margin: 0 0 5px 0;
            font-size: 13px;
        }

        .stat-row {
            font-size: 13px;
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
        }

        .board-container {
            position: relative;
            background: #fff;
            border: 4px solid #fff;
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 4px;
            background: #fff;
        }

        .cell {
            background: #4a0e4e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .cell.x { color: #ff4757; }
        .cell.o { color: #2ed573; }

        #line {
            position: absolute;
            background-color: #ffd700;
            height: 6px;
            border-radius: 3px;
            transform-origin: left center;
            transition: width 0.3s ease-in-out;
            width: 0;
            pointer-events: none;
            z-index: 10;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button.action-btn {
            background: #ff4757;
            border: none;
            color: white;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }

        #message {
            margin-top: 10px;
            font-size: 15px;
            height: 22px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
        }

        #series-info {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- START MENU SCREEN -->
    <div id="start-screen" class="screen">
        <div class="header-title">Tic Tac Toe</div>
        <div class="menu-box">
            <p class="menu-section-title">1. Game Mode Chuniye:</p>
            <div class="mode-buttons">
                <button class="option-btn selected" onclick="setMode('pvp')">👥 Friends</button>
                <button class="option-btn" onclick="setMode('pvc')">🤖 Computer</button>
            </div>

            <p class="menu-section-title" style="margin-top: 5px;">2. Total Game Kitne Khelne Hain?:</p>
            <div class="match-options">
                <button class="match-btn selected" id="m3" onclick="setGames(3)">3 Games</button>
                <button class="match-btn" id="m5" onclick="setGames(5)">5 Games</button>
            </div>
            <input type="number" id="custom-input" class="custom-input" placeholder="Ya apne hisab se likhein..." min="1" oninput="setCustomGames(this.value)">

            <button class="start-btn" onclick="startGame()">Play Game 🚀</button>
        </div>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="game-screen" class="screen hidden">
        <div class="header-title">Tic Tac Toe</div>
        <div id="series-info">Series: Best of <span id="max-display">3</span> (Adhe se adhik jeetne par series win)</div>

        <div class="scoreboard">
            <div class="player-card active" id="p1-card">
                <h3 id="p1-title">Player 1 (X)</h3>
                <div class="stat-row"><span>Wins:</span> <span id="p1-wins">0</span></div>
            </div>
            <div class="player-card" id="p2-card">
                <h3 id="p2-title">Player 2 (O)</h3>
                <div class="stat-row"><span>Wins:</span> <span id="p2-wins">0</span></div>
            </div>
        </div>

        <div class="board-container">
            <div id="line"></div>
            <div class="board">
                <div class="cell" onclick="cellClicked(0)"></div>
                <div class="cell" onclick="cellClicked(1)"></div>
                <div class="cell" onclick="cellClicked(2)"></div>
                <div class="cell" onclick="cellClicked(3)"></div>
                <div class="cell" onclick="cellClicked(4)"></div>
                <div class="cell" onclick="cellClicked(5)"></div>
                <div class="cell" onclick="cellClicked(6)"></div>
                <div class="cell" onclick="cellClicked(7)"></div>
                <div class="cell" onclick="cellClicked(8)"></div>
            </div>
        </div>

        <div id="message"></div>

        <div class="controls">
            <button class="action-btn" onclick="nextRound()">Agla Round</button>
            <button class="action-btn" onclick="goHome()" style="background: #2ed573;">🏠 Home Menu</button>
        </div>
    </div>

<script>
    let selectedMode = 'pvp';
    let targetGames = 3;
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let seriesOver = false;
    let stats = { X: 0, O: 0 };

    let audioCtx = null;

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    // 1. Sound 1: Chal/Move chalne par sound
    function playMoveSound() {
        try {
            let ctx = getAudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(currentPlayer === 'X' ? 440 : 580, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
    }

    // 2. Sound 2: Jab teeno ekh line me mile tab (Round Win / Line Match)
    function playRoundWinSound() {
        try {
            let ctx = getAudioContext();
            let now = ctx.currentTime;
            let notes = [300, 450, 600];
            notes.forEach((freq, idx) => {
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                gain.gain.setValueAtTime(0.15, now + idx * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.1);
                osc.stop(now + idx * 0.1 + 0.2);
            });
        } catch(e) {}
    }

    // 3. Sound 3: Final Winning Sound (Series Jeetne Par)
    function playSeriesWinSound() {
        try {
            let ctx = getAudioContext();
            let now = ctx.currentTime;
            let notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((freq, idx) => {
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                gain.gain.setValueAtTime(0.15, now + idx * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.12);
                osc.stop(now + idx * 0.12 + 0.3);
            });
        } catch(e) {}
    }

    const wins = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    const lineCSS = [
        { top: '47px', left: '12px', width: '254px', transform: 'rotate(0deg)' },
        { top: '141px', left: '12px', width: '254px', transform: 'rotate(0deg)' },
        { top: '235px', left: '12px', width: '254px', transform: 'rotate(0deg)' },
        { top: '12px', left: '47px', width: '254px', transform: 'rotate(90deg)' },
        { top: '12px', left: '141px', width: '254px', transform: 'rotate(90deg)' },
        { top: '12px', left: '235px', width: '254px', transform: 'rotate(90deg)' },
        { top: '12px', left: '12px', width: '360px', transform: 'rotate(45deg)' },
        { top: '12px', left: '266px', width: '360px', transform: 'rotate(135deg)' }
    ];

    function setMode(mode) {
        selectedMode = mode;
        const btns = document.querySelectorAll('.mode-buttons .option-btn');
        btns[0].classList.toggle('selected', mode === 'pvp');
        btns[1].classList.toggle('selected', mode === 'pvc');
    }

    function setGames(num) {
        targetGames = num;
        document.getElementById('custom-input').value = '';
        document.getElementById('m3').classList.toggle('selected', num === 3);
        document.getElementById('m5').classList.toggle('selected', num === 5);
    }

    function setCustomGames(val) {
        let n = parseInt(val);
        if (n > 0) {
            targetGames = n;
            document.getElementById('m3').classList.remove('selected');
            document.getElementById('m5').classList.remove('selected');
        }
    }

    function startGame() {
        getAudioContext();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        if (selectedMode === 'pvp') {
            document.getElementById('p1-title').innerText = "Player 1 (X)";
            document.getElementById('p2-title').innerText = "Player 2 (O)";
        } else {
            document.getElementById('p1-title').innerText = "You (X)";
            document.getElementById('p2-title').innerText = "Computer (O)";
        }

        document.getElementById('max-display').innerText = targetGames;
        stats = { X: 0, O: 0 };
        seriesOver = false;
        document.getElementById('p1-card').classList.remove('series-winner');
        document.getElementById('p2-card').classList.remove('series-winner');
        updateScore();
        nextRound();
    }

    function goHome() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    function cellClicked(index) {
        if (board[index] !== '' || !gameActive || seriesOver) return;
        if (selectedMode === 'pvc' && currentPlayer === 'O') return;

        makeMove(index, currentPlayer);

        if (gameActive && !seriesOver && selectedMode === 'pvc' && currentPlayer === 'O') {
            setTimeout(computerTurn, 400);
        }
    }

    function makeMove(index, player) {
        board[index] = player;
        const cellEls = document.querySelectorAll('.cell');
        cellEls[index].innerText = player;
        cellEls[index].className = `cell ${player.toLowerCase()}`;
        playMoveSound();
        checkGameResult();
    }

    function computerTurn() {
        if (!gameActive || seriesOver) return;
        let empty = [];
        board.forEach((v, i) => { if (v === '') empty.push(i); });
        if (empty.length === 0) return;

        let move = getWinningMove('O') ?? getWinningMove('X') ?? empty[Math.floor(Math.random() * empty.length)];
        makeMove(move, 'O');
    }

    function getWinningMove(player) {
        for (let combo of wins) {
            let [a, b, c] = combo;
            let vals = [board[a], board[b], board[c]];
            if (vals.filter(v => v === player).length === 2 && vals.includes('')) {
                if (board[a] === '') return a;
                if (board[b] === '') return b;
                if (board[c] === '') return c;
            }
        }
        return null;
    }

    function checkGameResult() {
        let won = false;
        let winningComboIdx = -1;

        for (let i = 0; i < wins.length; i++) {
            let [a, b, c] = wins[i];
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                won = true;
                winningComboIdx = i;
                break;
            }
        }

        if (won) {
            stats[currentPlayer]++;
            updateScore();
            gameActive = false;

            let lineEl = document.getElementById('line');
            let css = lineCSS[winningComboIdx];
            lineEl.style.top = css.top;
            lineEl.style.left = css.left;
            lineEl.style.transform = css.transform;
            lineEl.style.width = css.width;

            let name = selectedMode === 'pvp' ? (currentPlayer === 'X' ? 'Player 1 (X)' : 'Player 2 (O)') : (currentPlayer === 'X' ? 'You (X)' : 'Computer (O)');
            let threshold = Math.floor(targetGames / 2) + 1;

            if (stats[currentPlayer] >= threshold) {
                seriesOver = true;
                document.getElementById('message').innerText = `${name} Series Jeet Gaye! 🏆`;
                playSeriesWinSound();
                if (currentPlayer === 'X') {
                    document.getElementById('p1-card').classList.add('series-winner');
                } else {
                    document.getElementById('p2-card').classList.add('series-winner');
                }
            } else {
                document.getElementById('message').innerText = `${name} ne yeh round jeeta!`;
                playRoundWinSound();
            }
            return;
        }

        if (!board.includes('')) {
            document.getElementById('message').innerText = `Round Draw Raha! 🤝`;
            gameActive = false;
            return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateTurnUI();
    }

    function updateTurnUI() {
        if (currentPlayer === 'X') {
            document.getElementById('p1-card').classList.add('active');
            document.getElementById('p2-card').classList.remove('active');
        } else {
            document.getElementById('p2-card').classList.add('active');
            document.getElementById('p1-card').classList.remove('active');
        }
    }

    function updateScore() {
        document.getElementById('p1-wins').innerText = stats.X;
        document.getElementById('p2-wins').innerText = stats.O;
    }

    function nextRound() {
        if (seriesOver) {
            stats = { X: 0, O: 0 };
            seriesOver = false;
            document.getElementById('p1-card').classList.remove('series-winner');
            document.getElementById('p2-card').classList.remove('series-winner');
            updateScore();
        }
        board = ['', '', '', '', '', '', '', '', ''];
        gameActive = true;
        document.getElementById('message').innerText = '';
        currentPlayer = 'X';
        document.getElementById('line').style.width = '0';
        updateTurnUI();

        document.querySelectorAll('.cell').forEach(c => {
            c.innerText = '';
            c.className = 'cell';
        });
    }
</script>

</body>
</html>
